<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualisasi Pengeluaran &amp; Anggaran</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="light">

  <!-- Header -->
  <header>
    <h1>Visualisasi Pengeluaran &amp; Anggaran</h1>
    <button id="themeToggle" class="icon-btn" aria-label="Ganti mode gelap/terang">🌙</button>
  </header>

  <main>

    <!-- Total Saldo -->
    <section class="card balance-card" aria-label="Total Saldo">
      <p class="balance-label">TOTAL SALDO</p>
      <p id="totalBalance" class="balance-amount">Rp0</p>
    </section>

    <!-- Peringatan Batas Pengeluaran -->
    <div id="limitWarning" class="limit-warning hidden" role="alert">
      ⚠️ Total pengeluaran kamu telah melewati batas yang ditetapkan!
    </div>

    <!-- Tombol Ringkasan Bulanan -->
    <div class="section-header">
      <button id="toggleSummary" class="outline-btn">📅 Ringkasan Bulanan</button>
    </div>
    <section id="monthlySummary" class="card hidden" aria-label="Ringkasan Bulanan">
      <h2>Ringkasan Bulanan</h2>
      <div id="summaryContent"></div>
    </section>

    <!-- Form Tambah Transaksi -->
    <section class="card" aria-label="Tambah Transaksi">
      <h2>Tambah Transaksi</h2>
      <form id="transactionForm" novalidate>

        <div class="form-group">
          <label for="itemName">Nama Item</label>
          <input type="text" id="itemName" placeholder="cth. Kopi, Bensin..." autocomplete="off" />
          <span class="error-msg" id="itemNameError"></span>
        </div>

        <div class="form-group">
          <label for="amount">Jumlah (Rp)</label>
          <input type="number" id="amount" placeholder="0" min="1" step="1" />
          <span class="error-msg" id="amountError"></span>
        </div>

        <div class="form-group">
          <label for="category">Kategori</label>
          <select id="category">
            <option value="">-- Pilih Kategori --</option>
            <option value="Makanan">Makanan</option>
            <option value="Transportasi">Transportasi</option>
            <option value="Hiburan">Hiburan</option>
          </select>
          <span class="error-msg" id="categoryError"></span>
        </div>

        <!-- Input kategori kustom (fitur opsional) -->
        <div class="form-group" id="customCategoryGroup" style="display:none;">
          <label for="customCategory">Nama Kategori Baru</label>
          <input type="text" id="customCategory" placeholder="Masukkan nama kategori" />
          <span class="error-msg" id="customCategoryError"></span>
        </div>

        <!-- Batas pengeluaran (fitur opsional) -->
        <div class="form-group limit-group">
          <label for="spendingLimit">Batas Pengeluaran per Transaksi (opsional)</label>
          <input type="number" id="spendingLimit" placeholder="cth. 100000" min="0" step="1" />
        </div>

        <button type="submit" class="btn-primary">Tambah Transaksi</button>
      </form>
    </section>

    <!-- Daftar Transaksi + Grafik -->
    <div class="bottom-grid">

      <!-- Daftar Transaksi -->
      <section class="card transactions-card" aria-label="Daftar Transaksi">
        <div class="list-header">
          <h2>Transaksi</h2>
          <div class="sort-controls">
            <label for="sortSelect" class="sr-only">Urutkan berdasarkan</label>
            <select id="sortSelect" aria-label="Urutkan transaksi">
              <option value="default">Urutan: Default</option>
              <option value="amount-asc">Jumlah ↑</option>
              <option value="amount-desc">Jumlah ↓</option>
              <option value="category-asc">Kategori A-Z</option>
              <option value="category-desc">Kategori Z-A</option>
            </select>
          </div>
        </div>
        <div id="transactionList" class="transaction-list">
          <p class="empty-msg">Belum ada transaksi. Tambahkan di atas!</p>
        </div>
      </section>

      <!-- Grafik Pie -->
      <section class="card chart-card" aria-label="Pengeluaran per Kategori">
        <h2>Pengeluaran per Kategori</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart" aria-label="Grafik lingkaran pengeluaran per kategori" role="img"></canvas>
        </div>
        <p id="chartEmpty" class="empty-msg">Tambahkan transaksi untuk melihat grafik.</p>
      </section>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
